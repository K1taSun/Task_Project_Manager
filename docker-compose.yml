version: '3.8'

services:
  task-manager:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PROJECTS_FILE=/app/data/projects.json
      - TASKS_FILE=/app/data/tasks.json
    volumes:
      - ./data:/app/data
      - ./web/static:/app/web/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reload
  task-manager-dev:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PROJECTS_FILE=/app/data/projects.json
      - TASKS_FILE=/app/data/tasks.json
    volumes:
      - .:/app
      - ./data:/app/data
    command: ["go", "run", "./cmd/server"]
    profiles:
      - dev

  # Production service with nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - task-manager
    restart: unless-stopped
    profiles:
      - production

  # Database service (for future use)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles:
      - database

volumes:
  postgres_data:
